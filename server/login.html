<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>入場 | Super Hage BaseBall</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#102d4c;color:#fff;font:16px system-ui,sans-serif;padding:24px}main{width:min(100%,360px)}h1{font:italic 900 36px/1.05 Impact,Arial,sans-serif;margin:0 0 40px;border-bottom:6px solid #e34e3c;padding-bottom:18px}label{display:block;margin-bottom:10px}input,button{font:inherit;width:100%;padding:15px;border:2px solid #829bb4;border-radius:2px}input{background:#fff;color:#172f47;margin-bottom:18px}button{background:#d84032;color:#fff;border-color:#d84032;font-weight:700;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #ffd77c;outline-offset:3px}p{color:#c6d4e2;font-size:13px;line-height:1.7}</style></head><body><main><h1>SUPER HAGE<br>BASEBALL</h1><form method="post" action="/auth"><label for="password">入場パスワード</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required autofocus><input name="room" id="room" type="hidden"><button type="submit">入場する</button></form><p>パスワードを知っている方だけ入場できます。<br>サーバーの再起動後や12時間経過後は、再入力が必要です。</p></main><script>const code=location.hash.slice(1).toUpperCase();if(/^[A-Z0-9]{4}$/.test(code))document.getElementById('room').value=code;</script></body></html>
